# Cloudflare Email Worker: nhan email forward tu Gmail qua Email Routing va
# chuyen tiep vao app.
#
# DEPLOY BANG TAY. Day la dich deploy thu hai cua repo nay va no KHONG di theo
# `git push`. render.yaml co autoDeploy tren main, nen sua Go la push xong tu
# len; sua thu muc nay thi phai chay `npx wrangler deploy` tu trong
# emailworker/, khong thi Cloudflare van chay ban cu va email im lang sai theo
# kieu khong test nao bat duoc.
#
# Ban hien tai chi ghi log -- no ton tai de chung minh duong ong da thong.
# Lat 1 thay bang ban that: ky HMAC bang INBOUND_WEBHOOK_SECRET roi POST sang
# /inbox/{token}.
name = "email-inbox"
main = "src/index.js"
compatibility_date = "2026-08-28"

# Worker nay chi chay qua email handler, khong can route HTTP cong khai.
workers_dev = false
