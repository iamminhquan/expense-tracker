services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: expense
      POSTGRES_PASSWORD: expense
      POSTGRES_DB: expense_tracker
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

  app:
    build: .
    depends_on:
      - postgres
    environment:
      DATABASE_URL: postgres://expense:expense@postgres:5432/expense_tracker?sslmode=disable
      PORT: 8080
    ports:
      - "8080:8080"

volumes:
  pgdata:
